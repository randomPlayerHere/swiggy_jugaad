<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Swiggy Buzz</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="phone">
    <div class="phone-notch"></div>
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="6" width="3" height="6" rx="0.5"/><rect x="4.5" y="4" width="3" height="8" rx="0.5"/><rect x="9" y="2" width="3" height="10" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l-1.4 1.4C11.3 5 9.7 4.3 8 4.3S4.7 5 3.4 6.3L2 4.9C3.6 3.4 5.7 2.5 8 2.5zm0 3.4c1.3 0 2.5.5 3.4 1.4l-1.4 1.4c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8L4.6 7.3c.9-.9 2.1-1.4 3.4-1.4zm0 3.5c.6 0 1.1.5 1.1 1.1S8.6 11.6 8 11.6s-1.1-.5-1.1-1.1S7.4 9.4 8 9.4z"/></svg>
        <svg viewBox="0 0 25 12" width="25" height="12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.75" fill="currentColor"/></svg>
      </span>
    </div>

    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M4 10.5c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M3 11h18a1 1 0 0 1 1 1v.5a1.5 1.5 0 0 1-1.5 1.5h-16A1.5 1.5 0 0 1 3 12.5V11z" fill="white"/>
            <path d="M6 15h12l-1.1 4.4a2 2 0 0 1-1.94 1.6H9.04a2 2 0 0 1-1.94-1.6L6 15z" fill="white"/>
          </svg>
        </span>
        <div class="brand-text">
          <span class="brand-title">Swiggy Buzz</span>
          <span class="brand-subtitle" id="brand-subtitle">pantry assistant</span>
        </div>
      </div>
    </header>

    <main class="chat" id="chat"></main>

    <form class="composer" id="composer" autocomplete="off">
      <input
        type="text"
        id="composer-input"
        placeholder="Message Swiggy Buzz…"
        autocomplete="off"
        maxlength="500"
      />
      <button type="submit" id="composer-send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
          <path d="M3 11.5L20.5 3.5L14 20.5L11 13L3 11.5Z" fill="white" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="/chat.js"></script>
</body>
</html>
