[project]
name = "swiggy-buzz"
version = "0.1.0"
description = "Infers kitchen inventory from Swiggy Instamart order history, suggests recipes, and gap-orders missing items"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swiggy_buzz"]
