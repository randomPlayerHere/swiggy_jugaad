[project]
name = "swiggy-buzz"
version = "0.1.0"
description = "Infers kitchen inventory from Swiggy Instamart order history, suggests recipes, and gap-orders missing items"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.1",
    "openai>=2.44.0",
    "p2j>=1.3.2",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swiggy_buzz"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pytest>=9.1.1",
]
